                <div class="section">
        			<p class="adjust-height priest es">La gracia de nuestro Señor Jesucristo, <br>el amor del Padre <br>y la comunión del Espíritu Santo <br>estén con todos vosotros.</p>

			<p class="adjust-height priest ca hide">Germans: preparem-nos a celebrar els sants misteris, reconeixent els nostres pecats.</p>
			<p class="adjust-height priest en hide">Brethren: let us acknowledge our sins, and so prepare ourselves to celebrate the sacred mysteries.</p>
			<p class="adjust-height priest tl hide">Mga kapatid, aminin natin ang ating mga kasalanan<br>upang tayo’y maging marapat sa pagdiriwang ng mga banal na misteryo.</p>

                <div class="section">
        			<p class="adjust-height people es">Yo confieso ante Dios todopoderoso <br>y ante vosotros, hermanos,<br> que he pecado mucho <br>de pensamiento, palabra, <br>obra y omisión.<br>Por mi culpa, <br>por mi culpa, <br>por mi gran culpa.<br>Por eso ruego a santa María, siempre Virgen,<br>a los ángeles, a los santos <br>y a vosotros, hermanos,<br>que intercedáis por mí ante Dios, nuestro Señor.</p>
			<p class="adjust-height people ca hide">Jo confesso a Déu totpoderós <br>i a vosaltres, germans, <br>que he pecat, per culpa meva, <br>de pensament, paraula, <br>obra i omissió.<br><br><br><br>Per això, demano a la Verge Maria, Mare de Déu, <br>als àngels i als sants, <br>i a vosaltres, germans, <br>que pregueu per mi a Déu, nostre Senyor.</p>
			<p class="adjust-height people en hide">I confess to almighty God<br>and to you, my brothers and sisters,<br>that I have greatly sinned,<br>in my thoughts and in my words,<br>in what I have done and in what I have failed to do,<br>through my fault,<br>through my fault,<br>through my most grievous fault;<br>therefore I ask blessed Mary ever-Virgin,<br>all the Angels and Saints,<br>and you, my brothers and sisters,<br>to pray for me to the Lord our God.</p>
			<p class="adjust-height people tl hide">Inaamin ko sa makapangyarihang Diyos,<br>at sa inyo, mga kapatid,<br>na lubha akong nagkasala<br>sa isip, sa salita, sa gawa<br>at sa aking pagkukulang.<br><br><br><br><b>Kaya isinasamo ko sa Mahal na Birheng Maria,</b><br>sa lahat ng mga anghel at mga banal<br>at sa inyo, mga kapatid,<br>na ako’y ipanalangin sa Panginoon nating Diyos.</p>
			<p class="adjust-height people la hide">Confíteor Deo omnipoténti<br>et vobis, fratres,<br>quia peccávi nimis<br>cogitatióne, verbo,<br>ópere et omissióne:<br><b>mea culpa, <br>mea culpa, <br>mea máxima culpa.</b><br>Ideo precor beátam Maríam semper Vírginem,<br>omnes Angelos et Sanctos,<br>et vos, fratres,<br>oráre pro me ad Dóminum Deum nostrum.</p>
        </div>
                <div class="section">
        			<p class="adjust-height priest es">Dios todopoderoso tenga misericordia de nosotros, <br>perdone nuestros pecados <br>y nos lleve a la vida eterna.</p>
			<p class="adjust-height priest ca hide">Que Déu omnipotent s'apiadi de nosaltres, <br>ens perdoni els pecats <br>i ens dugui a la vida eterna.</p>
			<p class="adjust-height priest en hide">May almighty God have mercy on us,<br>forgive us our sins,<br>and bring us to everlasting life.</p>
			<p class="adjust-height priest tl hide">Kaawaan tayo ng makapangyarihang Diyos, <br>patawarin tayo sa ating mga kasalanan, <br>at patnubayan tayo sa buhay na walang hanggan.</p>
			<p class="adjust-height priest la hide">Misereátur nostri omnípotens Deus et, <br>dimíssis peccátis nostris, <br>perdúcat nos ad vitam ætérnam.</p>

                <div class="section">
        			<p class="adjust-height people es">Gloria a Dios en el cielo,<br> y en la tierra paz a los hombres que ama el Señor.<br><br>Por tu inmensa gloria <br>te alabamos,<br> te bendecimos, <br>te adoramos,<br> te glorificamos, <br>te damos gracias,<br> Señor Dios, Rey celestial, <br>Dios Padre todopoderoso. <br><br>Señor, Hijo único, Jesucristo,<br> Señor Dios, Cordero de Dios, Hijo del Padre;<br> tú que quitas el pecado del mundo, <br>ten piedad de nosotros;<br> tú que quitas el pecado del mundo, <br>atiende nuestra súplica;<br> tú que estás sentado a la derecha del Padre, <br>ten piedad de nosotros.<br><br>Porque sólo tú eres Santo,<br> sólo tú Señor, <br>sólo tú Altísimo, Jesucristo, <br>con el espíritu Santo <br>en la gloria de Dios Padre. <br><br>Amén.</p>
			<p class="adjust-height people ca hide">Glòria a Déu a dalt del cel<br>i a la terra pau als homes que estima el Senyor.<br><br>Us lloem, <br>us beneïm, <br>us adorem,<br>us glorifiquem, <br>us donem gràcies<br>per la vostra immensa glòria, <br>Senyor Déu, Rei celestial, <br>Déu Pare omnipotent. <br><br>Senyor, Fill unigènit, Jesucrist, <br>Senyor Déu, Anyell de Déu, Fill del Pare, <br>vós, que lleveu el pecat del món, <br>tingueu pietat de nosaltres; <br>vós, que lleveu el pecat del món, <br>acolliu la nostra súplica. <br>Vós, que seieu a la dreta del Pare, <br>tingueu pietat de nosaltres.<br><br>Perquè vós sou l'únic Sant,<br>vós l'únic Senyor,<br>vós l'únic Altíssim, Jesucrist, <br>amb l'Esperit Sant<br>en la glòria de Déu Pare. <br><br>Amén.</p>
			<p class="adjust-height people en hide">Glory to God in the highest,
			<br>and on earth peace to people of good will.<br>
			<br>We praise you,
			<br>we bless you,
			<br>we adore you,
			<br>we glorify you,
			<br>we give you thanks
			<br>for your great glory,
			<br>Lord God, heavenly King,
			<br>O God, almighty Father.<br>
			<br>Lord Jesus Christ, Only Begotten Son,
			<br>Lord God, Lamb of God, Son of the Father,
			<br>you take away the sins of the world,
			<br>have mercy on us;
			<br>you take away the sins of the world,
			<br>receive our prayer;
			<br>you are seated at the right hand of the Father,
			<br>have mercy on us.<br>
			<br>For you alone are the Holy One,
			<br>you alone are the Lord,
			<br>you alone are the Most High, Jesus Christ,
			<br>with the Holy Spirit,
			<br>in the glory of God the Father.<br>
			<br>Amén.</p>
			<p class="adjust-height people tl hide">Papuri sa Diyos sa kaitaasan<br>at sa lupa'y kapayapaan sa mga taong kinalulugdan niya.<br>Pinupuri ka namin,<br>dinarangal ka namin,<br>sinasamba ka namin,<br>ipinagbubunyi ka namin,<br>pinasasalamatan ka namin dahil sa dakila mong angking kapurihan.<br>Panginoong Diyos, Hari ng langit,<br>Diyos Amang makapangyarihan sa lahat.<br>Panginoong Hesukristo, Bugtong na Anak,<br>Panginoong Diyos, Kordero ng Diyos, Anak ng Ama.<br>Ikaw na nag-aalis ng mga kasalanan ng sanlibutan, maawa ka sa amin.<br>Ikaw na nag-aalis ng mga kasalanan ng sanlibutan, tanggapin mo ang aming kahilingan.<br>Ikaw na naluluklok sa kanan ng Ama, maawa ka sa amin.<br>Sapagkat ikaw lamang ang banal, ikaw lamang ang Panginoon,<br>ikaw lamang, O Hesukristo, ang Kataas-taasan,<br>kasama ng Espiritu Santo sa kadakilaan ng Diyos Ama. Amen.</p>
			<p class="adjust-height people la hide">Glória in excélsis Deo<br>et in terra pax homínibus bonæ voluntátis.<br>Laudámus te,<br>benedícimus te,<br>adorámus te,<br>glorificámus te,<br>grátias ágimus tibi propter magnam glóriam tuam,<br>Dómine Deus, Rex cæléstis,<br>Deus Pater omnípotens.<br>Dómine Fili unigénite, Iesu Christe,<br>Dómine Deus, Agnus Dei, Fílius Patris,<br>qui tollis peccáta mundi, miserére nobis;<br>qui tollis peccáta mundi, súscipe deprecatiónem nostram.<br>Qui sedes ad déxteram Patris, miserére nobis.<br>Quóniam tu solus Sanctus, tu solus Dóminus, tu solus Altíssimus,<br>Iesu Christe,<br>cum Sancto Spíritu: in glória Dei Patris. Amen.</p>
        </div>

      <div id="credo" class="bloque">
                      <h4 class="title es">Credo</h4>
                      <h4 class="title ca hide">Credo</h4>
                      <h4 class="title en hide">Creed</h4>
                      <h4 class="title tl hide">Sumasampalataya Ako</h4>
                      <h4 class="title la hide">Credo</h4>
                  </div>
                <div class="section">
        			<p class="adjust-height people es">Creo en Dios, <br>Padre todopoderoso, creador del cielo y de la tierra.<br><br>Creo en Jesucristo, su único Hijo, nuestro Señor; <br>que fue concebido por obra y gracia del Espíritu Santo, <br>nació de Santa María Virgen; <br>padeció bajo el poder de Poncio Pilato; <br>fue crucificado, muerto y sepultado; <br>descendió a los infiernos, <br>al tercer día resucitó de entre los muertos; <br>subió a los cielos y está sentado a la diestra de Dios Padre; <br>desde allí ha de venir a juzgar a los vivos y a los muertos.<br><br>Creo en el Espíritu Santo; <br>la Santa Iglesia Católica, <br>la comunión de los Santos, <br>el perdón de los pecados, <br>la resurrección de los muertos <br>y la vida eterna.<br><br>Amén.</p>
			<p class="adjust-height people ca hide">Crec en un Déu,<br>Pare totpoderós, creador del cel i de la terra,<br><br>I en Jesucrist, únic Fill seu i Senyor nostre; <br>el qual fou concebut per obra de l’Esperit Sant,<br>nasqué de Maria Verge;<br>patí sota el poder de Ponç Pilat,<br>fou crucificat, mort i sepultat;<br>davallà als inferns,<br>ressuscità el tercer dia d’entre els morts;<br>se’n pujà al cel, seu a la dreta de Déu, Pare totpoderós;<br>i d’allí ha de venir a jutjar els vius i els morts.<br><br>Crec en l’Esperit Sant;<br>la santa Mare Església catòlica;<br>la comunió dels sants;<br>la remissió dels pecats;<br>la resurrecció de la carn;<br>la vida perdurable. <br><br>Amén.</p>
			<p class="adjust-height people en hide">I believe in God,
				<br>the Father almighty,
				<br>Creator of heaven and earth,
				<br>and in Jesus Christ, his only Son, our Lord,
				<br>who was conceived by the Holy Spirit,
				<br>born of the Virgin Mary,
				<br>suffered under Pontius Pilate,
				<br>was crucified, died and was buried;
				<br>he descended into hell;
				<br>on the third day he rose again from the dead;
				<br>he ascended into heaven,
				<br>and is seated at the right hand of God the Father almighty;
				<br>from there he will come to judge the living and the dead.
				<br>
				<br>I believe in the Holy Spirit,
				<br>the holy catholic Church,
				<br>the communion of saints,
				<br>the forgiveness of sins,
				<br>the resurrection of the body,
				<br>and life everlasting.
				<br>
				<br>Amén.
			</p>
			<p class="adjust-height people tl hide">Sumasampalataya ako sa Diyos <br>Amang makapangyarihan sa lahat, na may gawa ng langit at lupa.<br><br>Sumasampalataya ako kay Hesukristo, iisang Anak ng Diyos, Panginoon nating lahat.<br>Nagkatawang-tao Siya lalang ng Espiritu Santo, <br>ipinanganak ni Santa Mariang Birhen.<br>Pinagpakasakit ni Poncio Pilato, <br>ipinako sa krus, namatay, inilibing.<br>Nanaog sa kinaroroonan ng mga yumao. <br>Nang may ikatlong araw, nabuhay na mag-uli.<br>Umakyat sa langit, naluluklok sa kanan ng Diyos Amang makapangyarihan sa lahat.<br>Doon magmumulang paririto at huhukom sa nangabubuhay at nangamatay na tao.<br><br>Sumasampalataya naman ako sa Diyos Espiritu Santo,<br>sa banal na Simbahang katolika;<br>sa kasamahan ng mga Banal;<br>Sa kapatawaran ng mga kasalanan,<br>Sa pagkabuhay na muli ng nangamatay na tao,<br>At sa buhay na walang-hanggan. <br><br>Amen.<br></p>
			<p class="adjust-height people la hide">Credo in Deum Patrem omnipoténtem, <br>Creatórem caeli et terrae. <br><br>Et in Iesum Christum, Fílium eius únicum, Dóminum nostrum,	<br>qui concéptus est de Spíritu Sancto, <br>natus ex María Vírgine, <br>passus sub Póntio Pilato, <br>rucifíxus, mórtuus, et sepúltus, <br>descéndit ad ínferos, <br>tértia die resurréxit a mórtuis, <br>ascéndit ad caelos, sedet ad déxteram Dei Patris omnipoténtis, <br>inde ventúrus est iudicáre vivos et mórtuos. <br><br>Credo in Spíritum Sanctum, <br>sanctam Ecclésiam cathólicam, <br>Sanctórum communiónem, <br>remissiónem peccatórum, <br>carnis resurrectiónem, <br>vitam aetérnam, <br><br>Amen.</p>
        </div>

      <div id="ofrendas" class="bloque">
                      <h4 class="title es">Presentación de las ofrendas</h4>
                      <h4 class="title ca hide">Presentació de les ofrenes</h4>
                      <h4 class="title en hide">Preparation of the Gifts</h4>
                      <h4 class="title tl hide">Paghahandog ng mga Alay</h4>

                <div class="section">
        			<p class="adjust-height priest es">Bendito seas, Señor, Dios del Universo, por este pan, <br>fruto de la tierra y del trabajo del hombre, <br>que recibimos de tu generosidad <br>y ahora te presentamos:<br>él será para nosotros pan de vida.</p>
			<p class="adjust-height priest ca hide">Us beneïm, Senyor, Déu de l'univers, per aquest pa <br>que hem rebut de la vostra bondat <br>i que és fruit de la terra i del treball del homes. <br>Us el presentem <br>perquè es converteixi per a nosaltres en pa de vida.</p>
			<p class="adjust-height priest en hide">Blessed are you, Lord God of all creation, <br>for through your goodness <br>we have received the bread we offer you:<br>fruit of the earth and work of human hands, <br>it will become for us the bread of life.</p>
			<p class="adjust-height priest tl hide">Kapuri-puri ka, Diyos Amang Lumikha sa sanlibutan.<br>sa iyong kagandahang-loob, narito ang aming maiaalay,<br>mula sa lupa at bunga ng aming paggawa<br>ang tinapay na ito,<br>para maging pagkaing nagbibigay-buhay.</p>
			<p class="adjust-height priest la hide">Benedíctus es, Dómine, Deus univérsi,<br>quia de tua largitáte accépimus panem,<br>quem tibi offérimus,<br>fructum terræ et óperis mánuum hóminum:<br>ex quo nobis fiet panis vitæ.</p>
        </div>
                <div class="section">
        			<p class="adjust-height people es">Bendito seas, por siempre, Señor.</p>
			<p class="adjust-height people ca hide">Que Déu sigui beneït per sempre.</p>
			<p class="adjust-height people en hide">Blessed be God for ever.</p>
			<p class="adjust-height people tl hide">Kapuri-puri ang Poong Maykapal ngayon at kailanman.</p>
			<p class="adjust-height people la hide">Benedíctus Deus in sǽcula.</p>
        </div>
                <div class="section">
        			<p class="adjust-height priest es">Bendito seas, Señor, Dios del Universo, por este vino, <br>fruto de la vid y del trabajo del hombre, <br>que recibimos de tu generosidad <br>y ahora te presentamos: <br>él será para nosotros bebida de salvación.</p>
			<p class="adjust-height priest ca hide">Us beneïm, Senyor, Déu de l'univers, per aquest vi <br>que hem rebut de la vostra bondat <br>i que és fruit de la vinya i del treball del homes. <br>Us el presentem <br>perquè es converteixi per a nosaltres en beguda espiritual.</p>
			<p class="adjust-height priest en hide">Blessed are you, Lord God of all creation, <br>for through your goodness <br>we have received the wine we offer you: <br>fruit of the vine and work of human hands <br>it will become our spiritual drink.</p>
			<p class="adjust-height priest tl hide">Kapuri-puri ka, Diyos amang Lumikha sa sanlibutan<br>sa iyong kagandahang-loob, narito ang aming maiaalay<br>mula sa katas ng ubas at bunga ng aming paggawa<br>ang alak na ito,<br>para maging inuming nagbibigay ng iyong Espiritu.</p>
			<p class="adjust-height priest la hide">Benedíctus es, Dómine, Deus univérsi,<br>quia de tua largitáte accépimus vinum,<br>quod tibi offérimus,<br>fructum vitis et óperis mánuum hóminum,<br>ex quo nobis fiet potus spiritális.</p>
        </div>
                <div class="section">
        			<p class="adjust-height people es">Bendito seas, por siempre, Señor.</p>
			<p class="adjust-height people ca hide">Que Déu sigui beneït per sempre.</p>
			<p class="adjust-height people en hide">Blessed be God for ever.</p>
			<p class="adjust-height people tl hide">Kapuri-puri ang Poong Maykapal ngayon at kailanman.</p>
			<p class="adjust-height people la hide">Benedíctus Deus in sǽcula.</p>
        </div>

      <div id="oracion_ofrendas" class="bloque">
                      <h4 class="title es">Oración sobre las ofrendas</h4>
                      <h4 class="title ca hide">Oració sobre les ofrenes</h4>
                      <h4 class="title en hide">Prayer over the Offerings</h4>
                      <h4 class="title tl hide">Panalangin sa mga Alay</h4>
                      <h4 class="title la hide">Oratio super oblata</h4>
                  </div>
                <div class="section">
        			<p class="adjust-height priest es">Orad hermanos, <br>para que este sacrificio, mío y vuestro, <br>sea agradable a Dios, Padre todopoderoso.</p>
			<p class="adjust-height priest ca hide">Pregueu, germans <br>perquè aquest sacrifici, meu i vostre, <br>sigui agradable a Déu Pare omnipotent.</p>
			<p class="adjust-height priest en hide">Pray, brethren (brothers and sisters), <br>that my sacrifice and yours <br>may be acceptable to God, the almighty Father.</p>
			<p class="adjust-height priest tl hide">Manalangin kayo, mga kapatid, <br>upang ang paghahain natin<br>ay kalugdan ng Diyos Amang Makapangyarihan.</p>
			<p class="adjust-height priest la hide">Oráte, fratres:<br>ut meum ac vestrum sacrifícium<br>acceptábile fiat apud Deum Patrem omnipoténtem.</p>
        </div>
                <div class="section">
        			<p class="adjust-height people es">Que el Señor reciba de tus manos este sacrificio, <br>para alabanza y gloria de su nombre, <br>para nuestro bien <br>y el de toda su santa Iglesia.</p>
			<p class="adjust-height people ca hide">Que el Senyor rebi de mans vostres aquest sacrifici,<br>a lloança i glòria del seu nom, <br>i també per al nostre bé <br>i de tota la seva santa Església.</p>
			<p class="adjust-height people en hide">May the Lord accept the sacrifice at your hands
			<br>for the praise and glory of his name,
			<br>for our good
			<br>and the good of all his holy Church.</p>
			<p class="adjust-height people tl hide">Tanggapin nawa ng Panginoon, itong paghahain sa Iyong mga kamay,<br>sa kapurihan niya at karangalan,<br>sa ating kapakinabangan,<br>at sa buong Sambayanan Niyang banal.</p>
			<p class="adjust-height people la hide">Suscípiat Dóminus sacrifícium de mánibus tuis<br>ad laudem et glóriam nóminis sui,<br>ad utilitátem quoque nostram<br>totiúsque Ecclésiæ suæ sanctæ.</p>
        </div>
                <div class="section">
        			<p class="adjust-height priest es">...</p>
			<p class="adjust-height priest ca hide">...</p>
			<p class="adjust-height priest en hide">...</p>
			<p class="adjust-height priest tl hide">...</p>
			<p class="adjust-height priest la hide">...</p>
        </div>
                <div class="section">
        			<p class="adjust-height people es">Amén.</p>
			<p class="adjust-height people ca hide">Amén.</p>
			<p class="adjust-height people en hide">Amen.</p>
			<p class="adjust-height people tl hide">Amen.</p>
			<p class="adjust-height people la hide">Amen.</p>
        </div>
                <div class="section">
        			<p class="adjust-height priest es">El Señor esté con vosotros.</p>
			<p class="adjust-height priest ca hide">El Senyor sigui amb vosaltres.</p>
			<p class="adjust-height priest en hide">The Lord be with you.</p>
			<p class="adjust-height priest tl hide">Sumainyo ang Panginoon.</p>
			<p class="adjust-height priest la hide">Dóminus vobíscum.</p>
        </div>
                <div class="section">
        			<p class="adjust-height people es">Y con tu espíritu.</p>
			<p class="adjust-height people ca hide">I amb el vostre esperit.</p>
			<p class="adjust-height people en hide">And with your spirit.</p>
			<p class="adjust-height people tl hide">At sumaiyo rin.</p>
			<p class="adjust-height people la hide">Et cum spíritu tuo.</p>
        </div>
                <div class="section">
        			<p class="adjust-height priest es">Levantemos el corazón.</p>
			<p class="adjust-height priest ca hide">Amunt els cors.</p>
			<p class="adjust-height priest en hide">Lift up your hearts.</p>
			<p class="adjust-height priest tl hide">Itaas sa Diyos ang inyong puso at diwa.</p>
			<p class="adjust-height priest la hide">Sursum corda.</p>
        </div>
                <div class="section">
        			<p class="adjust-height people es">Lo tenemos levantado hacia el Señor.</p>
			<p class="adjust-height people ca hide">Els elevem al Senyor.</p>
			<p class="adjust-height people en hide">We lift them up to the Lord.</p>
			<p class="adjust-height people tl hide">Itinaas na namin sa Panginoon.</p>
			<p class="adjust-height people la hide">Habémus ad Dóminum.</p>
        </div>
                <div class="section">
        			<p class="adjust-height priest es">Demos gracias al Señor, nuestro Dios.</p>
			<p class="adjust-height priest ca hide">Donem gràcies al Senyor, Déu nostre.</p>
			<p class="adjust-height priest en hide">Let us give thanks to the Lord our God.</p>
			<p class="adjust-height priest tl hide">Pasalamatan natin ang Panginoong ating Diyos.</p>
			<p class="adjust-height priest la hide">Grátias agámus Dómino Deo nostro.</p>
        </div>
                <div class="section">
        			<p class="adjust-height people es">Es justo y necesario</p>
			<p class="adjust-height people ca hide">Cal fer-ho i és de justícia</p>
			<p class="adjust-height people en hide">It is right and just</p>
			<p class="adjust-height people tl hide">Marapat na siya ay pasalamatan.</p>
			<p class="adjust-height people la hide">Dignum et iustum est.</p>

      <div id="prefacio" class="bloque">
                      <h4 class="title es always-hidden">Prefacio</h4>
                      <h4 class="title ca hide always-hidden">Prefaci</h4>
                      <h4 class="title en hide always-hidden">Preface</h4>
                      <h4 class="title tl hide always-hidden">Prefacio</h4>
                      <h4 class="title la hide always-hidden">Praefatio</h4>
                  </div>
                <div class="section">
        			<p class="adjust-height priest es">En verdad es justo y necesario,
				<br>es nuestro deber y salvación 
				<br>darte gracias siempre y en todo lugar, 
				<br>Señor, Padre santo, Dios todopoderoso y eterno
				<br>por Cristo nuestro Señor.
				<br>...
				<br>Por eso con los ángeles y los santos
				<br> proclamamos tu gloria, diciendo:</p>
			<p class="adjust-height priest ca hide">És realment just i necessari, 
				<br>és el nostre deure i és la nostra salvació, 
				<br>Senyor, Pare sant, Déu omnipotent i etern, 
				<br>que, sempre i en tot lloc, us donem gràcies.
				<br>...
				<br>Per això, amb els àngels i els sants
				<br>proclamem la vostra glòria dient:
			</p>
			<p class="adjust-height priest en hide">It is truly right and just, 
				<br>our duty and our salvation,
				<br>always and everywhere to give you thanks,
				<br>Lord, holy Father, almighty and eternal God,
				<br>through Christ our Lord.
				<br>...
				<br>And so, with all the Angels and Saints,
				<br>we declare your glory, as with one voice we acclaim:
			</p>
			<p class="adjust-height priest tl hide">Ama naming makapangyarihan,<br>tunay ngang marapat<br>na ikaw ay aming pasalamatan <br>sa pamamagitan ni Hesukristo <br>na aming Panginoon.<br>...<br>Kaya kaisa ng mga anghel na nagsisiawit ng papuri sa iyo<br>nang walang humpay sa kalangitan,<br>kami’y nagbubunyi sa iyong kadakilaan:</p>
			<p class="adjust-height priest la hide">Vere dignum et iustum est, <br>æquum et salutáre, <br>nos tibi, sancte Pater, <br>semper et ubíque grátias agere <br>per Fílium dilectiónis tuæ Iesum Christum,<br>...<br>Et ídeo cum Angelis et ómnibus Sanctus <br>glóriam tuam prædicámus, una voce dicéntes:</p>
        </div>
                </div>
      <div id="santo" class="bloque">
                      <h4 class="title es always-hidden">Santo</h4>
                      <h4 class="title ca hide always-hidden">Sant</h4>
                      <h4 class="title en hide always-hidden">Holy</h4>
                      <h4 class="title tl hide always-hidden">Santo</h4>
                      <h4 class="title la hide always-hidden">Sanctus</h4>
                  </div>
                <div class="section">
        			<p class="adjust-height people es">Santo, Santo, Santo es el Señor, <br>Dios del Universo. <br>Llenos están el cielo y la tierra de tu gloria. <br>Hosanna en el cielo.<br> Bendito el que viene en nombre del Señor. <br>Hosanna en el cielo.</p>
			<p class="adjust-height people ca hide">Sant, sant, sant és el Senyor, <br>Déu de l'univers. <br>El cel i la terra són plens de la vostra glòria. <br>Hosanna a dalt del cel.<br>Beneït el qui ve en nom del Senyor. <br>Hosanna a dalt del cel.</p>
			<p class="adjust-height people en hide">Holy, Holy, Holy Lord 
				<br>God of hosts.
				<br>Heaven and earth are full of your glory.
				<br>Hosanna in the highest.
				<br>Blessed is he who comes in the name of the Lord.
				<br>Hosanna in the highest.
			</p>
			<p class="adjust-height people tl hide">Santo santo santo <br>Panginoong Diyos ng mga hukbo<br>Napupuno ang langit at lupa ng kadakilaan mo<br>Hosanna hosanna hosanna sa kaitaasan<br>Pinagpala ang naparirito sa ngalan ng Panginoon<br>Hosanna hosanna hosanna sa kaitaasan</p>
			<p class="adjust-height people la hide">Sanctus, Sanctus, Sanctus Dóminus <br>Deus Sábaoth.<br>Pleni sunt cæli et terra glória tua.<br>Hosánna in excélsis.<br>Benedíctus qui venit in nómine Dómini.<br>Hosánna in excélsis.</p>
        </div>
                </div>
      <div id="plegaria_eucaristica" class="bloque">
                      <h4 class="title es always-hidden">Plegaria eucarística</h4>
                      <h4 class="title ca hide always-hidden">Pregària eucarística</h4>
                      <h4 class="title en hide always-hidden">Eucharistic Prayer</h4>
                      <h4 class="title tl hide always-hidden">Panalangin ng Pagpapabanal</h4>
                      <h4 class="title la hide always-hidden">Prex eucharistica</h4>
                  </div>
                <div class="section">
        			<p class="adjust-height priest es">Santo eres en verdad, Señor,
				<br>fuente de toda santidad;
				<br>por eso te pedimos que santifiques estos dones
				<br>con la efusión de tu Espíritu,
				<br>de manera que sean para nosotros <span class="cruz">✠</span>
				<br>Cuerpo y Sangre de Jesucristo, nuestro Señor.
				<br>
				<br>El cual, cuando iba a ser entregado a su Pasión,
				<br>voluntariamente aceptada,
				<br>tomó pan; dándote gracias, lo partió
				<br>y lo dio a sus discípulos diciendo:
				<br><span class="emphasis">
				<br>TOMAD Y COMED TODOS DE EL, PORQUE ESTO ES MI CUERPO,
				<br>QUE SERÁ ENTREGADO POR VOSOTROS.
				<br></span>
				<br>Del mismo modo, acabada la cena,
				<br>tomó el cáliz, y, dándote gracias de nuevo,
				<br>lo pasó a sus discípulos, diciendo:
				<br><span class="emphasis">
				<br>TOMAD Y BEBED TODOS DE EL,
				<br>PORQUE ÉSTE ES EL CÁLIZ DE MI SANGRE, SANGRE DE LA ALIANZA
				<br>NUEVA Y ETERNA, QUE SERÁ DERRAMADA POR VOSOTROS
				<br>Y POR MUCHOS
				<br>PARA EL PERDÓN DE LOS PECADOS.
				<br>HACED ESTO EN CONMEMORACIÓN MÍA.
				<br></span>
				<br>Éste es el Sacramento de nuestra fe:
			</p>
			<p class="adjust-height priest ca hide">Sou realment sant, Senyor, font de tota santedat.
				<br>Santifiqueu, doncs, aquestes ofrenes fent que hi davalli el vostre Esperit, com la rosada, perquè es converteixin per a nosaltres <span class="cruz">✠</span> en el Cos i en la Sang de Jesucrist, nostre Senyor.
				<br>Ell, 
				<br>en oferir-se lliurement a la passió, 
				<br>prengué el pa i, dient l'acció de gràcies, el partí, 
				<br>i el donà als seus deixebles, tot dient:
				<br><span class="emphasis">
				<br>PRENEU I MENGEU-NE TOTS, 
				<br>QUE AIXÒ ÉS EL MEU COS, ENTREGAT PER VOSALTRES. 
				<br></span>
				<br>Igualment, havent sopat,
				<br>prengué el calze, i, novament donant-vos gràcies,
				<br>el passà als seus deixebles, tot dient: 
				<br><span class="emphasis">
				<br>PRENEU I BEVEU-NE TOTS, 
				<br>QUE AQUEST ÉS EL CALZE DE LA MEVA SANG,
				<br>LA SANG DE L'ALIANÇA NOVA I ETERNA,
				<br>VESSADA PER VOSALTRES I PER MOLTS,
				<br>EN REMISSIÓ DELS PECATS.
				<br>FEU AIXÒ QUE ÉS EL MEU MEMORIAL. 
				<br></span>
				<br>Proclameu el misteri de la fe:
			</p>
			<p class="adjust-height priest en hide">You are indeed Holy, O Lord, 
				<br>the fount of all holiness.
				<br>Make holy, therefore, these gifts, we pray,   
				<br>by sending down your Spirit upon them like the dewfall,
				<br>so that they may become for us <span class="cruz">✠</span>
				<br>the Body and Blood of our Lord, Jesus Christ.
				<br>
				<br>At the time he was betrayed   
				<br>and entered willingly into his Passion,
				<br>he took bread and, giving thanks, broke it,
				<br>and gave it to his disciples, saying: 
				<br><span class="emphasis">
				<br>TAKE THIS, ALL OF YOU, AND EAT OF IT: FOR THIS IS MY BODY 
				<br>WHICH WILL BE GIVEN UP FOR YOU.
				<br></span>
				<br>In a similar way, when supper was ended,  
				<br>he took the chalice and, once more giving thanks,
				<br>he gave it to his disciples, saying:
				<br><span class="emphasis">
				<br>TAKE THIS, ALL OF YOU, AND DRINK FROM IT: 
				<br>FOR THIS IS THE CHALICE OF MY BLOOD, 
				<br>THE BLOOD OF THE NEW AND ETERNAL COVENANT, WHICH WILL BE POURED OUT FOR YOU 
				<br>AND FOR MANY FOR THE FORGIVENESS OF SINS. 
				<br>DO THIS IN MEMORY OF ME.
				<br></span>
				<br>The mystery of faith:
			</p>
			<p class="adjust-height priest tl hide">Ama naming banal,
    <br>ikaw ang bukal ng tanang kabanalan.
    <br>Kaya’t sa pamamagitan ng iyong Espiritu
    <br>gawin mong banal ang kaloob na ito
    <br>upang para sa ami’y maging Katawan at Dugo <span class="cruz">✠</span>
    <br>ng aming Panginoong Hesukristo.
    <br>
    <br>Bago niya pinagtiisang kusang loob na maging handog,
    <br>hinawakan niya ang tinapay,
    <br>pinasalamatan ka niya, pinaghati-hati niya iyon,
    <br>iniabot sa kanyang mga alagad at sinabi:
    <br><span class="emphasis">
    <br>TANGGAPIN NINYONG LAHAT ITO AT KANIN:
    <br>ITO ANG AKING KATAWAN NA IHAHANDOG PARA SA INYO.
    <br></span>
    <br>Gayundin naman, noong matapos ang hapunan,
    <br>hinawakan niya ang kalis, muli ka niyang pinasalamatan
    <br>iniabot niya ang kalis sa kanyang mga alagad at sinabi:
    <br><span class="emphasis">
    <br>TANGGAPIN NINYONG LAHAT ITO AT INUMIN:
    <br>ITO ANG KALIS NG AKING DUGO, NG BAGO AT WALANG HANGGANG TIPAN,
    <br>ANG AKING DUGO NA IBUBUHOS
    <br>PARA SA INYO AT PARA SA LAHAT
    <br>SA IKAPAGPAPATAWAD NG MGA KASALANAN.
    <br>GAWIN NINYO ITO SA PAG-ALALA SA AKIN.
    <br></span>
    <br>Ipagbunyi natin ang misteryo ng pananampalataya.</p>
			<p class="adjust-height priest la hide">Vere Sanctus es, Dómine,
<br>fons omnis sanctitátis
<br>Haec ergo dona, quaesumus, 
<br>Spíritus tui rore sanctifica, 
<br>ut nobis <span class="cruz">✠</span>
<br>Corpus et Sanguis fiant Dómini nostri Iesu Christi.
<br>
<br>Qui cum Passióni 
<br>voluntárie traderétur,
<br>accépit panem et grátias agens fregit,
<br>dedítque discípulis suis, dicens:
<br><span class="emphasis">
<br>ACCÍPITE ET MANDUCATE EX HOC OMNES: HOC EST ENIM CORPUS MEUM 
<br>QUOD PRO VOBIS TRADETUR.
<br></span>
<br>Símili modo, postquam cenátum est,
<br>accípiens et calicem, íterum grátias agens 
<br>dedit discípulis suis, dicens:
<br><span class="emphasis">
<br>ACCÍPITE ET BÍBITE EX EO OMNES: 
<br>HIC EST ENIM CALIX SÁNGUINIS MEI, 
<br>NOVI ET AETERNI TESTAMENTI, QUI PRO VOBIS 
<br>ET PRO MULTIS 
<br>EFFUNDÉTUR IN REMISSIONEM PECCATÓRUM. 
<br>HOC FÁCITE IN MEAM COMMEMORATIÓNEM.
<br></span>
<br>Mystérium fídei</p>
        </div>
                <div class="section">
        			<p class="adjust-height people es">Anunciamos tu muerte, <br>proclamamos tu resurrección. <br>¡Ven, Señor Jesús!</p>
			<p class="adjust-height people ca hide">Anunciem la vostra mort, <br>confessem la vostra resurrecció, <br>esperem el vostre retorn, Senyor Jesús!</p>
			<p class="adjust-height people en hide">We proclaim your Death, O Lord, <br>and profess your Resurrection <br>until you come again.</p>
			<p class="adjust-height people tl hide">Si Kristo'y namatay! <br>Si Kristo'y nabuhay! <br>Si Kristo'y babalik sa wakas ng panahon!</p>
			<p class="adjust-height people la hide">Mortem tuam annuntiámus, Dómine, <br>et tuam resurrectiónem confitémur, <br>donec vénias.</p>
        </div>
                <div class="section">
        			<p class="adjust-height comment es">Anamnesis ("Acuérdate")<br>Epíclesis (Invocación al Espíritu Santo)<br>Intercessiones<br>Doxología y gran Amén</p>
			<p class="adjust-height comment ca hide">Anamnesis ("Recordeu-vos")<br>Epíclesis (Invocació a l'Esperit Sant)<br>Intercessions<br>Doxologia i gran Amen</p>
			<p class="adjust-height comment en hide">Anamnesis ("Remembering")<br>Epiclesis (calling upon God's Spirit)<br>Intercessions<br>Doxology and Great Amen</p>
			<p class="adjust-height comment tl hide">Anamnesis ("Alalahanin")<br>Epiklesis (Panawagan sa Espiritu Santo)<br>Mga pamamagitan<br>Doxology at Great Amen</p>
			<p class="adjust-height comment la hide">Anamnesis ("Memento")<br>Epiclesis (Invocatio ad Spiritum Sanctum)<br>Intercessiones<br>Doxologia et magnum Amen
</p>
        </div>
                <div class="section">
        			<p class="adjust-height priest es">Por Cristo, con él y en él, <br>a ti Dios Padre omnipotente, <br>en la unidad del Espíritu Santo, <br>todo honor y toda gloria, <br>por los siglos de los siglos.</p>
			<p class="adjust-height priest ca hide">Per ell, amb ell i en ell, <br>vós, Déu Pare omnipotent, <br>en la unitat de l'Esperit Sant, <br>rebeu tot honor i tota glòria <br>pels segles dels segles.</p>
			<p class="adjust-height priest en hide">Through him, and with him, and in him, <br>O God, almighty Father, <br>in the unity of the Holy Spirit, <br>all glory and honor is yours, <br>for ever and ever.</p>
			<p class="adjust-height priest tl hide">Sa pamamagitan ni Kristo, kasama niya at sa kanya,<br>ang lahat ng parangal at papuri ay sa iyo<br>Diyos Amang makapangyarihan,<br>kasama ng Espiritu Santo,<br>magpasawalang hanggan.</p>
			<p class="adjust-height priest la hide">Per ipsum, et cum ipso, et in ipso, <br>est tibi Deo Patri omnipoténti, <br>in unitáte Spíritus sancti, <br>omnis honor et glória <br>per ómnia saecula saeculórum</p>
        </div>
                <div class="section">
        			<p class="adjust-height people es">Amén.</p>
			<p class="adjust-height people ca hide">Amén.</p>
			<p class="adjust-height people en hide">Amen.</p>
			<p class="adjust-height people tl hide">Amen.</p>
			<p class="adjust-height people la hide">Amen.</p>
        </div>
                </div>
                <div class="section">
                  <h3 class="title es">Rito de la Comunión</h3>
                  <h3 class="title ca hide">Ritu de la Comunió</h3>
                  <h3 class="title en hide">Communion Rite</h3>
                  <h3 class="title tl hide">Rito ng Komunyon</h3>
                  <h3 class="title la hide">Ritus communionis</h3>
              </div>
      <div id="padre_nuestro" class="bloque">
                      <h4 class="title es always-hidden">Padre Nuestro</h4>
                      <h4 class="title ca hide always-hidden">Pare Nostre</h4>
                      <h4 class="title en hide always-hidden">Our Father</h4>
                      <h4 class="title tl hide always-hidden">Ama Namin</h4>
                      <h4 class="title la hide always-hidden">Pater Noster</h4>
                  </div>
                <div class="section">
        			<p class="adjust-height priest es">Fieles a la recomendación del Salvador <br>y siguiendo su divina enseñanza, <br>nos atrevemos a decir:</p>
			<p class="adjust-height priest ca hide">Fidels a un manament del Salvador, <br>i seguint el seu diví mestratge, <br>gosem dir:</p>
			<p class="adjust-height priest en hide">At the Savior’s command <br>and formed by divine teaching, <br>we dare to say:</p>
			<p class="adjust-height priest tl hide">Sa tagubilin ng mga nakagagaling na utos<br>at sa turo ni Hesus na Panginoon natin at Diyos,<br>ipahayag natin nang lakas-loob:</p>
			<p class="adjust-height priest la hide">Praeceptis salutaribus moniti, <br>et divina institutione formati, <br>audemus dicere:</p>
        </div>
                <div class="section">
        			<p class="adjust-height people es">Padre nuestro, que estás en el cielo,<br>santificado sea tu Nombre;<br>venga a nosotros tu reino;<br>hágase tu voluntad <br>en la tierra como en el cielo.<br><br>Danos hoy nuestro pan de cada día;<br>perdona nuestras ofensas,<br>como también nosotros perdonamos a los que nos ofenden;<br>no nos dejes caer en la tentación,<br>y líbranos del mal.</p>
			<p class="adjust-height people ca hide">Pare nostre, que esteu en el cel:<br>Sigui santificat el vostre nom;<br>vingui a nosaltres el vostre Regne;<br>faci's la vostra voluntat, <br>així a la terra com es fa en el cel.<br><br>El nostre pa de cada dia doneu-nos, Senyor, el dia d'avui;<br>i perdoneu les nostres culpes,<br>així com nosaltres perdonem els nostres deutors;<br>i no permeteu que nosaltres caiguema la temptació,<br>ans deslliureu-nos de qualsevol mal</p>
			<p class="adjust-height people en hide">Our Father, who art in heaven,<br>hallowed be thy name;<br>thy kingdom come,<br>thy will be done<br>on earth as it is in heaven.<br><br>Give us this day our daily bread,<br>and forgive us our trespasses,<br>as we forgive those who trespass against us;<br>and lead us not into temptation,<br>but deliver us from evil.</p>
			<p class="adjust-height people tl hide">Ama namin, sumasalangit ka.<br>Sambahin ang ngalan mo.<br>Mapasaamin ang kaharian mo.<br>Sundin ang loob mo,<br>dito sa lupa para nang sa langit.<br><br>Bigyan mo kami ngayon ng aming kakanin sa araw-araw.<br>At patawarin mo kami sa aming mga sala<br>para ng pagpapatawad namin sa nagkakasala samin.<br>At huwag mo kami ipahintulot sa tukso.<br>At iadya mo kami sa lahat ng masama.</p>
			<p class="adjust-height people la hide">Pater noster, qui es in cælis: <br>sanctificétur nomen tuum; <br>advéniat regnum tuum; <br>fiat volúntas tua, <br>sicut in cælo, et in terra. <br><br>Panem nostrum cotidiánum da nobis hódie; <br>et dimítte nobis débita nostra, <br>sicut et nos dimíttimus debitóribus nostris; <br>et ne nos indúcas in tentatiónem; <br>sed líbera nos a malo.</p>
        </div>
                <div class="section">
        			<p class="adjust-height priest es">Líbranos de todos los males, Señor,<br> y concédenos la paz en nuestros días, <br>para que, ayudados por tu misericordia, <br>vivamos siempre libres de pecado<br> y protegidos de toda perturbación, <br>mientras esperamos la gloriosa venida <br>de nuestro Salvador Jesucristo.</p>
			<p class="adjust-height priest ca hide">Allibereu-nos, Senyor de tots els mals;<br>feu que hi hagi pau als nostres dies,<br>i per la vostra misericòrdia,<br>guardeu-nos de pecat<br>i de qualsevol pertorbació:<br>mentre esperem<br>l'acompliment de la nostra esperança,<br>la manifestació de Jesucrist,<br>el nostre Salvador.</p>
			<p class="adjust-height priest en hide">Deliver us, Lord, we pray, from every evil,
				<br>graciously grant peace in our days,
				<br>that, by the help of your mercy,
				<br>we may be always free from sin
				<br>and safe from all distress,
				<br>as we await the blessed hope
				<br>and the coming of our Saviour, Jesus Christ.
			</p>
			<p class="adjust-height priest tl hide">Hinihiling naming<br>kami’y iadya sa lahat ng masama,<br>pagkalooban ng kapayapaan araw-araw,<br>illigtas sa kasalanan<br>at ilayo sa lahat ng kapahamakan,<br>samantalang aming pinananabikan<br>ang dakilang araw ng pagpapahayag<br>ng Tagapagligtas naming si Hesukristo.</p>
			<p class="adjust-height priest la hide">Líbera nos, quǽsumus, Dómine, ab ómnibus malis, <br>da propítius pacem in diébus nostris, <br>ut, ope misericórdiæ tuæ adiúti, <br>et a peccáto simus semper líberi <br>et ab omni perturbatióne secúri: <br>exspectántes beátam spem et advéntum Salvatóris <br>nostri Iesu Christi.</p>
        </div>
                <div class="section">
        			<p class="adjust-height people es">Tuyo es el reino, <br>tuyo el poder y la gloria, <br>por siempre, Señor.</p>
			<p class="adjust-height people ca hide">Perquè són vostres per sempre, <br>el regne, <br>el poder i la glòria.</p>
			<p class="adjust-height people en hide">For the kingdom,<br>the power and the glory are yours<br>now and for ever.</p>
			<p class="adjust-height people tl hide">Sapagkat iyo ang kaharian <br>at ang kapangyarihan <br>at ang kapurihan magpakailanman, Amen.</p>
			<p class="adjust-height people la hide">Quia tuum est regnum, <br>et potéstas, <br>et glória in sǽcula.</p>
        </div>
                </div>
      <div id="rito_paz" class="bloque">
                      <h4 class="title es always-hidden">Rito de la paz</h4>
                      <h4 class="title ca hide always-hidden">Ritu de la pau</h4>
                      <h4 class="title en hide always-hidden">Sign of Peace</h4>
                      <h4 class="title tl hide always-hidden">Rito ng Kapayapaan</h4>
                      <h4 class="title la hide always-hidden">Ritus pacis</h4>
                  </div>
                <div class="section">
        			<p class="adjust-height priest es">Señor Jesucristo, <br>que dijiste a tus apóstoles: <br>"La paz os dejo, mi paz os doy";<br>no tengas en cuenta nuestros pecados,<br>sino la fe de tu Iglesia<br>y, conforme a tu palabra, <br>concédele la paz y la unidad.<br>Tú que vives y reinas <br>por los siglos de los siglos.</p>
			<p class="adjust-height priest ca hide">Senyor nostre Jesucrist,<br>que diguéreu als apòstols:<br>"Us deixo la pau, us dono la meva pau";<br>no mireu els nostres pecats,<br>sinó la fe de l'Església,<br>i doneu-li aquella pau i aquella unitat<br>que vós vau demanar.<br>Vós que viviu i regneu <br>pels segles dels segles.</p>
			<p class="adjust-height priest en hide">Lord Jesus Christ,<br>who said to your Apostles:<br>Peace I leave you, my peace I give you,<br>look not on our sins,<br>but on the faith of your Church,<br>and graciously grant her peace and unity<br>in accordance with your will.<br>Who live and reign <br>for ever and ever.</p>
			<p class="adjust-height priest tl hide">Panginoong Hesukristo,<br>Sinabi mo sa iyong mga Apostol:<br>“Kapayapaan ang iniwan ko sa inyo.<br>Ang aking kapayapaan ang ibinibigay ko sa inyo.”<br>Tunghayan mo ang aming pananampalataya<br>at huwag ang aming pagkakasala.<br>Pagkalooban mo kami ng kapayapaan<br>at pagkakaisa ayon sa iyong kalooban</p>
			<p class="adjust-height priest la hide">Dómine Iesu Christe, <br>qui dixísti Apóstolis tuis: <br>Pacem relínquo vobis, pacem meam do vobis; <br>ne respícias peccáta nostra, <br>sed fidem Ecclésiæ tuæ; <br>eámque secúndum voluntátem tuam pacificáre <br>et coadunáre dignéris. <br>Qui vivis et regnas <br>in sǽcula sæculórum.</p>
        </div>
                <div class="section">
        			<p class="adjust-height people es">Amén.</p>
			<p class="adjust-height people ca hide">Amén.</p>
			<p class="adjust-height people en hide">Amen.</p>
			<p class="adjust-height people tl hide">Amen.</p>
			<p class="adjust-height people la hide">Amen.</p>
        </div>
                <div class="section">
        			<p class="adjust-height priest es">La Paz del Señor estén siempre con todos vosotros.</p>
			<p class="adjust-height priest ca hide">La pau del Senyor sigui sempre amb vosaltres.</p>
			<p class="adjust-height priest en hide">The peace of the Lord be with you always.</p>
			<p class="adjust-height priest tl hide">Ang kapayapaan ng Panginoon ay laging sumainyo.</p>
			<p class="adjust-height priest la hide">Pax Dómini sit semper vobíscum.</p>
        </div>
                <div class="section">
        			<p class="adjust-height people es">Y con tu espíritu.</p>
			<p class="adjust-height people ca hide">I amb el vostre esperit.</p>
			<p class="adjust-height people en hide">And with your spirit.</p>
			<p class="adjust-height people tl hide">At sumaiyo rin.</p>
			<p class="adjust-height people la hide">Et cum spíritu tuo.</p>
        </div>
                <div class="section">
        			<p class="adjust-height priest es">Daos fraternalmente la Paz.</p>
			<p class="adjust-height priest ca hide">Doneu-vos la pau.</p>
			<p class="adjust-height priest en hide">Let us offer each other the sign of peace.</p>
